name: Windows Desktop Store Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop-store-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and submit Microsoft Store MSIX
    runs-on: windows-latest
    environment: microsoft-store

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -LiteralPath "desktopApp/version.txt" -Raw).Trim()
          if ($version -notmatch "^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$") {
            throw "desktopApp/version.txt must use MAJOR.MINOR.PATCH."
          }

          if ($env:EVENT_NAME -eq "push") {
            $expectedTag = "desktop-v$version"
            if ($env:RELEASE_TAG -ne $expectedTag) {
              throw "Desktop release tag must match the committed Desktop version: $expectedTag"
            }
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "store=$version.0" >> $env:GITHUB_OUTPUT

      - name: Verify Desktop release source
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:REF_NAME -ne "desktop") {
            throw "Manual Desktop Store releases must run from the desktop branch."
          }

          git fetch origin desktop
          git merge-base --is-ancestor HEAD origin/desktop
          if ($LASTEXITCODE -ne 0) {
            throw "The Desktop release commit must belong to the desktop branch."
          }

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and create Windows app image
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon `
            :desktopApp:test `
            :desktopApp:createDistributable `
            "-PdesktopVersion=${{ steps.version.outputs.value }}"

      - name: Build Store MSIX
        shell: pwsh
        run: |
          ./desktopApp/scripts/package-msix.ps1 `
            -Version "${{ steps.version.outputs.value }}"

      - name: Create checksum
        shell: pwsh
        run: |
          $msix = Get-Item "desktopApp/build/msix/SSUTime-${{ steps.version.outputs.value }}-windows-x64.msix"
          $hash = (Get-FileHash -LiteralPath $msix.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($msix.Name)" |
            Out-File `
              -FilePath "$($msix.FullName).sha256" `
              -Encoding ascii `
              -NoNewline

      - name: Publish GitHub Release notes
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "desktopApp/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing Desktop release notes: $notes"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag `
              --title "Windows v${{ steps.version.outputs.value }}" `
              --notes-file $notes
          } else {
            gh release create $tag `
              --verify-tag `
              --title "Windows v${{ steps.version.outputs.value }}" `
              --notes-file $notes
          }

      - name: Upload Store submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSUTime-${{ steps.version.outputs.value }}-Microsoft-Store
          path: |
            desktopApp/build/msix/*.msix
            desktopApp/build/msix/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Validate Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $required = @(
            "AZURE_AD_APPLICATION_CLIENT_ID",
            "AZURE_AD_APPLICATION_SECRET",
            "AZURE_AD_TENANT_ID",
            "SELLER_ID"
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing required Microsoft Store secret: $name"
            }
          }

      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Authenticate Microsoft Store Developer CLI
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

      - name: Upload package and request Store certification
        shell: pwsh
        run: |
          $msix = Get-Item "desktopApp/build/msix/SSUTime-${{ steps.version.outputs.value }}-windows-x64.msix"
          msstore publish $msix.FullName -id "9N8DJHBJDRGR"

      - name: Read Store submission status
        shell: pwsh
        run: msstore submission status "9N8DJHBJDRGR"

      - name: Write summary
        shell: pwsh
        run: |
          @"
          ## Microsoft Store MSIX

          - Desktop version: `${{ steps.version.outputs.value }}`
          - MSIX version: `${{ steps.version.outputs.store }}`
          - Store ID: `9N8DJHBJDRGR`
          - Distribution: Microsoft Store
          - Submission: Package uploaded and certification requested automatically

          The artifact is intentionally not attached to the public GitHub Release.
          "@ >> $env:GITHUB_STEP_SUMMARY
